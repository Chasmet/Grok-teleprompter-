name: Construire APK Live v2.16.3 UI privée

on:
  push:
    paths:
      - '.github/workflows/build-live-v2163-private-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tester exclusion UI et construire APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Vérifier politique de capture Live
        run: |
          SRC=app/src/main/java/com/chasmet/grokteleprompter/LiveOverlayService.java
          node --check script.js
          node --check live-mode.js
          grep -q 'excludeFromRecording(teleParams);' "$SRC"
          grep -q 'excludeFromRecording(controlsParams);' "$SRC"
          grep -q 'params.flags |= WindowManager.LayoutParams.FLAG_SECURE;' "$SRC"
          ! grep -q 'excludeFromRecording(cameraParams);' "$SRC"
          grep -q 'recordingTimerLoop' "$SRC"
          grep -q 'updateRecordingChrome' "$SRC"
      - name: Installer dépendances audit
        run: npm ci
      - name: Audit statique
        run: npm test
      - name: Installer Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Tester gestes et chronomètre
        run: |
          gradle :app:testDebugUnitTest \
            --tests 'com.chasmet.grokteleprompter.LiveOverlayGeometryTest' \
            --tests 'com.chasmet.grokteleprompter.LiveRecordingClockTest' \
            --stacktrace
      - name: Lint et compiler APK
        run: gradle :app:lintDebug :app:assembleDebug --stacktrace
      - name: Préparer APK v2.16.3
        run: cp app/build/outputs/apk/debug/app-debug.apk Grok-Teleprompter-v2.16.3-Private-UI.apk
      - name: Publier APK testé
        uses: actions/upload-artifact@v4
        with:
          name: Grok-Teleprompter-v2.16.3-Private-UI
          path: Grok-Teleprompter-v2.16.3-Private-UI.apk
          if-no-files-found: error
          retention-days: 30
