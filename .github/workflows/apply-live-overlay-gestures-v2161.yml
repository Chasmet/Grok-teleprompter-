name: Apply compact Live overlay gestures

on:
  push:
    paths:
      - '.github/workflows/apply-live-overlay-gestures-v2161.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply native overlay patch
        run: python3 tools/patch_live_overlay_v2161.py
      - name: Validate patched source
        run: |
          grep -q 'attachCameraDirectGesture' app/src/main/java/com/chasmet/grokteleprompter/LiveOverlayService.java
          grep -q 'gestes actifs' app/src/main/java/com/chasmet/grokteleprompter/LiveOverlayService.java
          grep -q 'baseParams(dp(126), dp(168))' app/src/main/java/com/chasmet/grokteleprompter/LiveOverlayService.java
      - name: Commit native Live gestures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/chasmet/grokteleprompter/LiveOverlayService.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: compact and unlock live overlay gestures"
          git pull --rebase origin main
          git push origin HEAD:main
