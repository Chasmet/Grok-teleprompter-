name: Add teleprompter orientation v2.17.3

on:
  push:
    paths:
      - '.github/workflows/add-tele-orientation-v2173.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add portrait and landscape teleprompter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{label}: marker not found in {path}')
              p.write_text(text.replace(old, new, 1))

          # Interface: a dedicated teleprompter orientation picker, visible in every studio mode.
          replace_once(
              'index.html',
              '''      <section class="gestureHelp" aria-label="Aide tactile">\n        <span>Facecam : glisse et pince pour la placer · fonctionne aussi pendant REC</span>\n        <span id="teleScrollState">Texte court : reste fixe</span>\n      </section>\n\n      <section class="formatPicker" aria-label="Orientation de la fenêtre webcam facecam">''',
              '''      <section class="gestureHelp" aria-label="Aide tactile">\n        <span>Facecam : glisse et pince pour la placer · fonctionne aussi pendant REC</span>\n        <span id="teleScrollState">Texte court : reste fixe</span>\n      </section>\n\n      <section class="teleOrientationPicker" aria-label="Orientation du téléprompteur">\n        <div class="formatTitle">Orientation du téléprompteur</div>\n        <div class="formatChoices">\n          <label class="formatChoice">\n            <input id="teleFormatVertical" name="teleprompterFormat" type="radio" value="vertical" checked>\n            <span>▯ Portrait <strong>9:16</strong></span>\n          </label>\n          <label class="formatChoice">\n            <input id="teleFormatHorizontal" name="teleprompterFormat" type="radio" value="horizontal">\n            <span>▭ Paysage <strong>16:9</strong></span>\n          </label>\n        </div>\n        <p class="teleOrientationHint">Pour une vidéo horizontale, choisis Paysage : le cadre et le texte s’adaptent sans modifier la vidéo.</p>\n      </section>\n\n      <section class="formatPicker" aria-label="Orientation de la fenêtre webcam facecam">''',
              'orientation picker'
          )

          # Styling: reuse the existing strong portrait/landscape choice design.
          replace_once(
              'style.css',
              '''.formatPicker { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.08); background: #0b1430; }\n.formatTitle { margin-bottom: 8px; color: #dbeafe; font-size: 13px; font-weight: 900; text-align: center; }''',
              '''.formatPicker, .teleOrientationPicker { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.08); background: #0b1430; }\n.formatTitle { margin-bottom: 8px; color: #dbeafe; font-size: 13px; font-weight: 900; text-align: center; }\n.teleOrientationHint { margin: 7px 2px 0; color: #93a8c7; font-size: 10px; font-weight: 800; line-height: 1.35; text-align: center; }''',
              'orientation styles'
          )

          # DOM references.
          replace_once(
              'script.js',
              '''    faceFormatVertical: $('faceFormatVertical'), faceFormatHorizontal: $('faceFormatHorizontal'),\n    microphoneHelp: $('microphoneHelp'), microphoneHelpText: $('microphoneHelpText'),''',
              '''    faceFormatVertical: $('faceFormatVertical'), faceFormatHorizontal: $('faceFormatHorizontal'),\n    teleFormatVertical: $('teleFormatVertical'), teleFormatHorizontal: $('teleFormatHorizontal'),\n    microphoneHelp: $('microphoneHelp'), microphoneHelpText: $('microphoneHelpText'),''',
              'tele orientation DOM refs'
          )

          # Preserve existing users' custom box until they explicitly choose portrait or landscape.
          replace_once(
              'script.js',
              '''    teleBox: { ...DEFAULT_TELE_BOX }, telePointers: new Map(), teleGesture: null,\n    teleShouldScroll: false,''',
              '''    teleBox: { ...DEFAULT_TELE_BOX }, telePointers: new Map(), teleGesture: null,\n    teleOrientation: 'free', teleShouldScroll: false,''',
              'tele orientation state'
          )

          replace_once(
              'script.js',
              '''  const selectedFaceOrientation = () => elements.faceFormatHorizontal.checked ? 'horizontal' : 'vertical';\n  const liveTracks = (stream, kind) => stream?.getTracks().filter((track) => track.kind === kind && track.readyState === 'live') || [];''',
              '''  const selectedFaceOrientation = () => elements.faceFormatHorizontal.checked ? 'horizontal' : 'vertical';\n  const selectedTeleOrientation = () => elements.teleFormatHorizontal.checked ? 'horizontal' : 'vertical';\n  const liveTracks = (stream, kind) => stream?.getTracks().filter((track) => track.kind === kind && track.readyState === 'live') || [];''',
              'tele orientation selector'
          )

          # Re-apply a chosen teleprompter format whenever the stage/video aspect changes.
          replace_once(
              'script.js',
              '''  function setAspect(width, height) {\n    state.mediaWidth = Math.max(1, Number(width) || 720);\n    state.mediaHeight = Math.max(1, Number(height) || 1280);\n    resizeStage();\n    applyFaceAspect();\n  }''',
              '''  function setAspect(width, height) {\n    state.mediaWidth = Math.max(1, Number(width) || 720);\n    state.mediaHeight = Math.max(1, Number(height) || 1280);\n    resizeStage();\n    applyFaceAspect();\n    if (state.teleOrientation !== 'free') applyTeleAspect(false);\n  }''',
              'setAspect tele orientation'
          )

          # Real 9:16 / 16:9 geometry in screen pixels. The box remains centered and inside the stage.
          replace_once(
              'script.js',
              '''  function layoutTeleprompter() {\n    const box = state.teleBox;\n    elements.teleprompter.style.left = `${box.x * 100}%`;\n    elements.teleprompter.style.top = `${box.y * 100}%`;\n    elements.teleprompter.style.width = `${box.w * 100}%`;\n    elements.teleprompter.style.height = `${box.h * 100}%`;\n    if (!state.teleRunning && !state.telePaused) requestAnimationFrame(updateTeleScrollMode);\n  }\n\n  function moveFace(position) {''',
              '''  function layoutTeleprompter() {\n    const box = state.teleBox;\n    elements.teleprompter.style.left = `${box.x * 100}%`;\n    elements.teleprompter.style.top = `${box.y * 100}%`;\n    elements.teleprompter.style.width = `${box.w * 100}%`;\n    elements.teleprompter.style.height = `${box.h * 100}%`;\n    elements.teleprompter.dataset.orientation = state.teleOrientation === 'horizontal' ? 'horizontal' : 'vertical';\n    if (!state.teleRunning && !state.telePaused) requestAnimationFrame(updateTeleScrollMode);\n  }\n\n  function applyTeleAspect(announce = true) {\n    const orientation = selectedTeleOrientation();\n    state.teleOrientation = orientation;\n    const stageRatio = Math.max(.1, state.mediaWidth / Math.max(1, state.mediaHeight));\n    const wantedRatio = orientation === 'horizontal' ? 16 / 9 : 9 / 16;\n    const centerX = state.teleBox.x + state.teleBox.w / 2;\n    const centerY = state.teleBox.y + state.teleBox.h / 2;\n    const maxWidth = .94;\n    const maxHeight = .90;\n    let width = clamp(state.teleBox.w, .24, maxWidth);\n    let height = width * stageRatio / wantedRatio;\n    if (height > maxHeight) {\n      height = maxHeight;\n      width = height * wantedRatio / stageRatio;\n    }\n    if (width > maxWidth) {\n      width = maxWidth;\n      height = width * stageRatio / wantedRatio;\n    }\n    if (width < .24) {\n      width = .24;\n      height = width * stageRatio / wantedRatio;\n    }\n    if (height < .20) {\n      height = .20;\n      width = height * wantedRatio / stageRatio;\n    }\n    if (height > maxHeight) {\n      height = maxHeight;\n      width = height * wantedRatio / stageRatio;\n    }\n    state.teleBox = {\n      x: clamp(centerX - width / 2, 0, 1 - width),\n      y: clamp(centerY - height / 2, 0, 1 - height),\n      w: width,\n      h: height\n    };\n    layoutTeleprompter();\n    updateTeleText(false);\n    if (announce) showStatus(orientation === 'horizontal'\n      ? 'Téléprompteur paysage 16:9 activé'\n      : 'Téléprompteur portrait 9:16 activé');\n  }\n\n  function moveFace(position) {''',
              'apply tele aspect'
          )

          # Persist the user's selected teleprompter orientation with the existing layout.
          replace_once(
              'script.js',
              '''        greenFace: state.greenFace,\n        teleBox: state.teleBox,\n        mirrored: state.mirrored''',
              '''        greenFace: state.greenFace,\n        teleBox: state.teleBox,\n        teleOrientation: state.teleOrientation,\n        mirrored: state.mirrored''',
              'save tele orientation'
          )

          replace_once(
              'script.js',
              '''      state.face = { ...state.classicFace };\n      state.teleBox = restoreBox(layout?.teleBox, DEFAULT_TELE_BOX, .35, .24);\n      if (typeof layout?.mirrored === 'boolean') state.mirrored = layout.mirrored;''',
              '''      state.face = { ...state.classicFace };\n      state.teleBox = restoreBox(layout?.teleBox, DEFAULT_TELE_BOX, .24, .20);\n      state.teleOrientation = layout?.teleOrientation === 'horizontal' || layout?.teleOrientation === 'vertical'\n        ? layout.teleOrientation : 'free';\n      elements.teleFormatHorizontal.checked = state.teleOrientation === 'horizontal';\n      elements.teleFormatVertical.checked = state.teleOrientation !== 'horizontal';\n      if (typeof layout?.mirrored === 'boolean') state.mirrored = layout.mirrored;''',
              'restore tele orientation'
          )

          # Orientation buttons work even during REC because they only change the private on-screen prompt overlay.
          replace_once(
              'script.js',
              '''  [elements.faceFormatVertical, elements.faceFormatHorizontal].forEach((input) => input.addEventListener('change', (event) => {\n    if (!event.target.checked || (state.recorder && state.recorder.state !== 'inactive')) return;\n    applyFaceAspect();\n    saveScript();\n    showStatus(selectedFaceOrientation() === 'horizontal'\n      ? 'Webcam paysage 16:9 sélectionnée'\n      : 'Webcam verticale 9:16 sélectionnée');\n  }));\n  elements.scriptInput.addEventListener('input', () => {''',
              '''  [elements.faceFormatVertical, elements.faceFormatHorizontal].forEach((input) => input.addEventListener('change', (event) => {\n    if (!event.target.checked || (state.recorder && state.recorder.state !== 'inactive')) return;\n    applyFaceAspect();\n    saveScript();\n    showStatus(selectedFaceOrientation() === 'horizontal'\n      ? 'Webcam paysage 16:9 sélectionnée'\n      : 'Webcam verticale 9:16 sélectionnée');\n  }));\n  [elements.teleFormatVertical, elements.teleFormatHorizontal].forEach((input) => input.addEventListener('change', (event) => {\n    if (!event.target.checked) return;\n    applyTeleAspect(true);\n    saveScript();\n  }));\n  elements.scriptInput.addEventListener('input', () => {''',
              'tele orientation listeners'
          )

          # Reset keeps old dimensions and clears the forced aspect so no saved layout is destroyed.
          replace_once(
              'script.js',
              '''    state.teleBox = { ...DEFAULT_TELE_BOX };\n    elements.sizeRange.value = '36';''',
              '''    state.teleBox = { ...DEFAULT_TELE_BOX };\n    state.teleOrientation = 'free';\n    elements.teleFormatVertical.checked = true;\n    elements.teleFormatHorizontal.checked = false;\n    elements.sizeRange.value = '36';''',
              'reset tele orientation'
          )

          # Keep 9:16 / 16:9 when the resize handle is used after choosing an orientation.
          replace_once(
              'script.js',
              '''    } else if (gesture.pointerId === event.pointerId && gesture.kind === 'resize') {\n      const dx = (event.clientX - gesture.startX) / stageRect.width;\n      const dy = (event.clientY - gesture.startY) / stageRect.height;\n      state.teleBox.w = clamp(gesture.box.w + dx, .35, 1 - gesture.box.x);\n      state.teleBox.h = clamp(gesture.box.h + dy, .24, 1 - gesture.box.y);\n    } else if (gesture.pointerId === event.pointerId && gesture.kind === 'drag') {''',
              '''    } else if (gesture.pointerId === event.pointerId && gesture.kind === 'resize') {\n      const dx = (event.clientX - gesture.startX) / stageRect.width;\n      const dy = (event.clientY - gesture.startY) / stageRect.height;\n      if (state.teleOrientation === 'horizontal' || state.teleOrientation === 'vertical') {\n        const widthScale = (gesture.box.w + dx) / Math.max(.01, gesture.box.w);\n        const heightScale = (gesture.box.h + dy) / Math.max(.01, gesture.box.h);\n        const scale = clamp(Math.min(widthScale, heightScale), .35, 2.5);\n        const width = clamp(gesture.box.w * scale, .24, 1 - gesture.box.x);\n        const height = clamp(gesture.box.h * scale, .20, 1 - gesture.box.y);\n        const uniformScale = Math.min(width / gesture.box.w, height / gesture.box.h);\n        state.teleBox.w = gesture.box.w * uniformScale;\n        state.teleBox.h = gesture.box.h * uniformScale;\n      } else {\n        state.teleBox.w = clamp(gesture.box.w + dx, .35, 1 - gesture.box.x);\n        state.teleBox.h = clamp(gesture.box.h + dy, .24, 1 - gesture.box.y);\n      }\n    } else if (gesture.pointerId === event.pointerId && gesture.kind === 'drag') {''',
              'aspect-safe resize'
          )

          # E2E: verify actual on-screen pixel aspect ratios, then keep all existing drag/REC tests.
          replace_once(
              'tests/app.e2e.js',
              '''  await expect(prompt).toHaveAttribute('data-scroll-mode', 'static');\n  await expect(page.locator('#teleScrollState')).toHaveText('Texte court : reste fixe');\n\n  const start = await prompt.boundingBox();''',
              '''  await expect(prompt).toHaveAttribute('data-scroll-mode', 'static');\n  await expect(page.locator('#teleScrollState')).toHaveText('Texte court : reste fixe');\n  await expect(page.locator('.teleOrientationPicker')).toBeVisible();\n\n  await page.locator('#teleFormatHorizontal').check();\n  await expect(prompt).toHaveAttribute('data-orientation', 'horizontal');\n  const horizontal = await prompt.boundingBox();\n  expect(horizontal.width / horizontal.height).toBeGreaterThan(1.70);\n  expect(horizontal.width / horizontal.height).toBeLessThan(1.86);\n\n  await page.locator('#teleFormatVertical').check();\n  await expect(prompt).toHaveAttribute('data-orientation', 'vertical');\n  const vertical = await prompt.boundingBox();\n  expect(vertical.width / vertical.height).toBeGreaterThan(.53);\n  expect(vertical.width / vertical.height).toBeLessThan(.60);\n\n  const start = await prompt.boundingBox();''',
              'orientation e2e'
          )

          # Android version for an in-place update preserving app data.
          replace_once('app/build.gradle', '        versionCode 27\n        versionName \'2.17.2\'', '        versionCode 28\n        versionName \'2.17.3\'', 'version bump')
          PY

          git diff --check
          node --check script.js

      - name: Install interface tests
        run: npm ci

      - name: Run static audit
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test portrait landscape and REC touch
        run: npm run test:e2e

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Lint and build APK
        run: gradle :app:lintDebug :app:assembleDebug --stacktrace

      - name: Commit tested v2.17.3 and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html style.css script.js tests/app.e2e.js app/build.gradle
          git rm .github/workflows/add-tele-orientation-v2173.yml
          git commit -m 'feat: teleprompter portrait and landscape v2.17.3'
          git push origin main
