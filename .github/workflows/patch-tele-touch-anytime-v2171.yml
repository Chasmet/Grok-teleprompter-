name: Patch teleprompter touch anytime v2.17.1

on:
  push:
    paths:
      - '.github/workflows/patch-tele-touch-anytime-v2171.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Enable text drag at any time
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text()

          replacements = [
            ("teleTouchPointer: -1, teleTouchStartY: 0, teleTouchStartOffset: 0, downloadUrl: '',",
             "teleTouchPointer: -1, teleTouchStartY: 0, teleTouchStartOffset: 0, teleTouchWasRunning: false, downloadUrl: '',"),
            ("if (state.telePaused && !explicitHandle) return;", "if (!explicitHandle) return;"),
            ("    if (!state.telePaused) return;\n    if (event.target === elements.teleResizeHandle || event.target === elements.teleMoveHandle) return;\n    state.teleTouchPointer = event.pointerId;\n    state.teleTouchStartY = event.clientY;\n    state.teleTouchStartOffset = state.teleOffsetPx;",
             "    if (event.target === elements.teleResizeHandle || event.target === elements.teleMoveHandle || state.teleTouchPointer !== -1) return;\n    state.teleTouchPointer = event.pointerId;\n    state.teleTouchStartY = event.clientY;\n    state.teleOffsetPx = currentTeleOffset();\n    state.teleTouchStartOffset = state.teleOffsetPx;\n    state.teleTouchWasRunning = state.teleRunning && !state.telePaused;\n    if (state.teleTouchWasRunning) {\n      state.teleRunning = false;\n      if (state.teleRaf) cancelAnimationFrame(state.teleRaf);\n      state.teleRaf = 0;\n    }"),
            ("    if (!state.telePaused || event.pointerId !== state.teleTouchPointer) return;",
             "    if (event.pointerId !== state.teleTouchPointer) return;"),
            ("    if (event.pointerId !== state.teleTouchPointer) return;\n    state.teleTouchPointer = -1;\n    try { elements.teleprompter.releasePointerCapture(event.pointerId); } catch (_) {}",
             "    if (event.pointerId !== state.teleTouchPointer) return;\n    const resumeAfterTouch = state.teleTouchWasRunning && !state.telePaused && teleHasText();\n    state.teleTouchPointer = -1;\n    state.teleTouchWasRunning = false;\n    try { elements.teleprompter.releasePointerCapture(event.pointerId); } catch (_) {}\n    if (resumeAfterTouch) {\n      updateTeleScrollMode();\n      if (state.teleShouldScroll && state.teleOffsetPx < maxTeleMove()) runTeleprompterFrom(state.teleOffsetPx);\n      else setTeleOffset(state.teleOffsetPx);\n    }"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Expected script block not found: ' + old[:80])
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          old = 'En pause : glisse le texte avec le doigt. Utilise ✥ Déplacer le texte pour bouger le cadre, même pendant REC.'
          new = 'Glisse le texte vers le haut ou le bas à tout moment, même pendant REC. Utilise ✥ Déplacer le texte pour bouger le cadre.'
          if old not in s: raise SystemExit('Help text not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('app/build.gradle')
          s = p.read_text()
          if "versionCode 25" not in s or "versionName '2.17.0'" not in s:
              raise SystemExit('Expected v2.17.0 not found')
          s = s.replace('versionCode 25', 'versionCode 26', 1).replace("versionName '2.17.0'", "versionName '2.17.1'", 1)
          p.write_text(s)
          PY
          node --check script.js
          grep -q "teleTouchWasRunning" script.js
          grep -q "versionName '2.17.1'" app/build.gradle
          git diff --check

      - name: Run tests
        run: |
          npm ci
          npm test

      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js index.html app/build.gradle
          git commit -m 'fix: allow teleprompter text drag anytime v2.17.1'
          git push origin main
