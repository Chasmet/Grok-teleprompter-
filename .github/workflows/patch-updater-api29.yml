name: Patch updater API 29 compatibility

on:
  push:
    paths:
      - '.github/workflows/patch-updater-api29.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace Android 13-only stream API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/chasmet/grokteleprompter/SettingsActivity.java')
          s = p.read_text()
          pattern = re.compile(r'(?m)^(\s*)byte\[\] bytes = input\.readAllBytes\(\);\n\1return new String\(bytes, StandardCharsets\.UTF_8\);')
          match = pattern.search(s)
          if not match:
              raise SystemExit('Expected readAllBytes lines not found')
          indent = match.group(1)
          replacement = (
              indent + 'java.io.ByteArrayOutputStream output = new java.io.ByteArrayOutputStream();\n' +
              indent + 'byte[] buffer = new byte[8192];\n' +
              indent + 'int read;\n' +
              indent + 'while ((read = input.read(buffer)) != -1) {\n' +
              indent + '    output.write(buffer, 0, read);\n' +
              indent + '}\n' +
              indent + 'return new String(output.toByteArray(), StandardCharsets.UTF_8);'
          )
          p.write_text(pattern.sub(replacement, s, count=1))
          PY
          ! grep -q 'readAllBytes' app/src/main/java/com/chasmet/grokteleprompter/SettingsActivity.java
          git diff --check
      - name: Commit compatibility fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/chasmet/grokteleprompter/SettingsActivity.java
          git commit -m 'fix: support updater on Android 10+' || exit 0
          git push origin main
