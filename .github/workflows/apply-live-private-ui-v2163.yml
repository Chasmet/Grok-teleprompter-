name: Apply Live private UI v2.16.3

on:
  push:
    paths:
      - '.github/workflows/apply-live-private-ui-v2163.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exclude teleprompter and controls from MediaProjection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/chasmet/grokteleprompter/LiveOverlayService.java')
          s = path.read_text()

          tele_anchor = '''        teleParams = baseParams(Math.max(dp(170), teleWidth), dp(165));\n        teleParams.gravity = Gravity.TOP | Gravity.START;'''
          tele_new = '''        teleParams = baseParams(Math.max(dp(170), teleWidth), dp(165));\n        excludeFromRecording(teleParams);\n        teleParams.gravity = Gravity.TOP | Gravity.START;'''
          if tele_new not in s:
              if tele_anchor not in s:
                  raise SystemExit('teleParams anchor not found')
              s = s.replace(tele_anchor, tele_new, 1)

          controls_anchor = '''        controlsParams = baseParams(Math.max(dp(210), controlsWidth), WindowManager.LayoutParams.WRAP_CONTENT);\n        controlsParams.gravity = Gravity.TOP | Gravity.START;'''
          controls_new = '''        controlsParams = baseParams(Math.max(dp(210), controlsWidth), WindowManager.LayoutParams.WRAP_CONTENT);\n        excludeFromRecording(controlsParams);\n        controlsParams.gravity = Gravity.TOP | Gravity.START;'''
          if controls_new not in s:
              if controls_anchor not in s:
                  raise SystemExit('controlsParams anchor not found')
              s = s.replace(controls_anchor, controls_new, 1)

          method_anchor = '''    private WindowManager.LayoutParams baseParams(int width, int height) {'''
          method = '''    private void excludeFromRecording(WindowManager.LayoutParams params) {\n        // Keep this overlay visible on the phone while excluding it from screenshots/MediaProjection.\n        params.flags |= WindowManager.LayoutParams.FLAG_SECURE;\n    }\n\n'''
          if method not in s:
              if method_anchor not in s:
                  raise SystemExit('baseParams anchor not found')
              s = s.replace(method_anchor, method + method_anchor, 1)

          path.write_text(s)
          PY
      - name: Validate capture policy
        run: |
          SRC=app/src/main/java/com/chasmet/grokteleprompter/LiveOverlayService.java
          grep -q 'excludeFromRecording(teleParams);' "$SRC"
          grep -q 'excludeFromRecording(controlsParams);' "$SRC"
          grep -q 'FLAG_SECURE' "$SRC"
          ! grep -q 'excludeFromRecording(cameraParams);' "$SRC"
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/chasmet/grokteleprompter/LiveOverlayService.java
          git diff --cached --quiet && exit 0
          git commit -m 'fix: hide Live teleprompter UI from recordings'
          git push origin HEAD:main
