name: Retry real teleprompter rotation v2.17.4

on:
  push:
    paths:
      - '.github/workflows/retry-real-tele-rotation-v2174.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply corrected rotation patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/add-real-tele-rotation-v2174.yml').read_text()
          start_token = "          python3 - <<'PY'\n"
          end_token = "          PY\n\n          git diff --check"
          start = workflow.index(start_token) + len(start_token)
          end = workflow.index(end_token, start)
          raw = workflow[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in raw.splitlines()]
          code = '\n'.join(lines) + '\n'

          label_pos = code.index("'rotation listeners'")
          block_start = code.rfind('replace_once(', 0, label_pos)
          block_end = code.index('\n)', label_pos) + 2
          corrected = '''p = Path('script.js')
          text = p.read_text()
          marker = "  elements.scriptInput.addEventListener('input', () => {"
          insertion = """  [elements.teleRotation0, elements.teleRotationLeft, elements.teleRotationRight].forEach((input) => input.addEventListener('change', (event) => {
            if (!event.target.checked) return;
            applyTeleRotation(Number(event.target.value), true);
            saveScript();
          }));
          elements.scriptInput.addEventListener('input', () => {"""
          if marker not in text:
              raise SystemExit('rotation listeners fallback: marker not found')
          p.write_text(text.replace(marker, insertion, 1))'''
          code = code[:block_start] + corrected + code[block_end:]
          exec(compile(code, 'real_tele_rotation_patch.py', 'exec'), {'__name__': '__main__'})
          PY

          git diff --check
          node --check script.js

      - name: Install tests
        run: npm ci

      - name: Static audit
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Mobile and rotation tests
        run: npm run test:e2e

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Android lint and APK
        run: gradle :app:lintDebug :app:assembleDebug --stacktrace

      - name: Verify stable signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Commit tested v2.17.4
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-real-tele-rotation-v2174.yml .github/workflows/retry-real-tele-rotation-v2174.yml
          git add index.html style.css script.js manifest.json sw.js app/build.gradle app/src/main/AndroidManifest.xml tests/app.e2e.js tests/static-audit.test.mjs
          git commit -m "fix: real landscape teleprompter rotation v2.17.4"
          git push origin main

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Grok-Teleprompter-v2.17.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grok-Teleprompter-APK-v2.17.4
          path: Grok-Teleprompter-v2.17.4.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish internal update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.17.4 >/dev/null 2>&1; then
            gh release upload v2.17.4 Grok-Teleprompter-v2.17.4.apk --clobber
            gh release edit v2.17.4 \
              --title "Grok Téléprompteur v2.17.4" \
              --notes "Rotation paysage corrigée : l'application suit réellement l'orientation du téléphone et le téléprompteur peut aussi pivoter manuellement de 90° à gauche ou à droite. Mise à jour directe depuis Réglages > Mise à jour interne."
          else
            gh release create v2.17.4 Grok-Teleprompter-v2.17.4.apk \
              --target main \
              --title "Grok Téléprompteur v2.17.4" \
              --notes "Rotation paysage corrigée : l'application suit réellement l'orientation du téléphone et le téléprompteur peut aussi pivoter manuellement de 90° à gauche ou à droite. Mise à jour directe depuis Réglages > Mise à jour interne." \
              --latest
          fi
