name: Construire APK Live v2.16

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-live:
    name: Valider et construire Live v2.16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Vérifier JavaScript Live
        run: |
          node --check script.js
          node --check live-mode.js

      - name: Audit statique
        run: |
          npm ci
          npm test

      - name: Installer Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Lint et compilation APK
        run: gradle :app:lintDebug :app:assembleDebug --stacktrace

      - name: Préparer APK v2.16
        run: cp app/build/outputs/apk/debug/app-debug.apk Grok-Teleprompter-v2.16.0-Live.apk

      - name: Publier APK Live
        uses: actions/upload-artifact@v4
        with:
          name: Grok-Teleprompter-v2.16.0-Live
          path: Grok-Teleprompter-v2.16.0-Live.apk
          if-no-files-found: error
          retention-days: 30
