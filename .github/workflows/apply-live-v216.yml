name: Apply Live V216 Upgrade

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply native live mode integration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  print('already patched:', label)
                  return False
              if old not in text:
                  raise SystemExit(f'Patch introuvable: {label} dans {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('patched:', label)
              return True

          changed = False

          # Web assets: nouveau choix 3 modes + setup Live.
          changed |= replace_once(
              'index.html',
              '  <link rel="stylesheet" href="style.css">\n  <script src="script.js" defer></script>\n',
              '  <link rel="stylesheet" href="style.css">\n  <link rel="stylesheet" href="live-mode.css">\n  <script src="script.js" defer></script>\n  <script src="live-mode.js" defer></script>\n',
              'index live assets'
          )

          # Android manifest: overlays + foreground service Live.
          changed |= replace_once(
              'app/src/main/AndroidManifest.xml',
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n',
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n',
              'manifest live permissions'
          )
          changed |= replace_once(
              'app/src/main/AndroidManifest.xml',
              '        <activity\n            android:name=".MainActivity"',
              '        <service\n            android:name=".LiveOverlayService"\n            android:exported="false"\n            android:foregroundServiceType="mediaProjection|camera|microphone" />\n\n        <activity\n            android:name=".MainActivity"',
              'manifest live service'
          )

          # Version 2.16 + nouveaux assets dans l’APK.
          changed |= replace_once('app/build.gradle', "        versionCode 19\n        versionName '2.15.1'\n", "        versionCode 20\n        versionName '2.16.0'\n", 'version 2.16')
          changed |= replace_once(
              'app/build.gradle',
              "        include 'index.html', 'style.css', 'script.js', 'native-audio-worklet.js', 'manifest.json', 'sw.js', 'icon-512.png'\n",
              "        include 'index.html', 'style.css', 'script.js', 'live-mode.css', 'live-mode.js', 'native-audio-worklet.js', 'manifest.json', 'sw.js', 'icon-512.png'\n",
              'sync live assets'
          )

          # Workflow principal : valider le JS Live et publier une APK v2.16.0.
          changed |= replace_once(
              '.github/workflows/build-apk.yml',
              '      - name: Vérifier JavaScript\n        run: node --check script.js\n',
              '      - name: Vérifier JavaScript\n        run: |\n          node --check script.js\n          node --check live-mode.js\n',
              'validate live js'
          )
          changed |= replace_once(
              '.github/workflows/build-apk.yml',
              '      - name: Renommer l\'APK\n        run: cp app/build/outputs/apk/debug/app-debug.apk Grok-Teleprompter-v2.15.1.apk\n',
              '      - name: Renommer l\'APK\n        run: cp app/build/outputs/apk/debug/app-debug.apk Grok-Teleprompter-v2.16.0.apk\n',
              'apk name v216'
          )
          changed |= replace_once(
              '.github/workflows/build-apk.yml',
              '          path: Grok-Teleprompter-v2.15.1.apk\n',
              '          path: Grok-Teleprompter-v2.16.0.apk\n',
              'artifact path v216'
          )

          # MainActivity : permission overlay + MediaProjection + lancement du service.
          changed |= replace_once(
              'app/src/main/java/com/chasmet/grokteleprompter/MainActivity.java',
              'import android.media.MediaRecorder;\n',
              'import android.media.MediaRecorder;\nimport android.media.projection.MediaProjectionManager;\n',
              'main media projection import'
          )
          changed |= replace_once(
              'app/src/main/java/com/chasmet/grokteleprompter/MainActivity.java',
              '    private static final int FILE_CHOOSER_REQUEST = 2002;\n',
              '    private static final int FILE_CHOOSER_REQUEST = 2002;\n    private static final int LIVE_RUNTIME_PERMISSION_REQUEST = 2003;\n    private static final int LIVE_OVERLAY_PERMISSION_REQUEST = 2004;\n    private static final int LIVE_CAPTURE_REQUEST = 2005;\n',
              'main live request codes'
          )
          changed |= replace_once(
              'app/src/main/java/com/chasmet/grokteleprompter/MainActivity.java',
              '    private OnBackInvokedCallback backCallback;\n',
              '    private OnBackInvokedCallback backCallback;\n    private LiveLaunchRequest pendingLiveLaunch;\n',
              'main pending live state'
          )

          old_permissions = '''    @Override
    public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] results) {
        super.onRequestPermissionsResult(requestCode, permissions, results);
        if (requestCode == RUNTIME_PERMISSION_REQUEST && pendingWebPermission != null) {
            PermissionRequest request = pendingWebPermission;
            pendingWebPermission = null;
            grantAllowedWebResources(request);
        }
    }
'''
          new_permissions = '''    @Override
    public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] results) {
        super.onRequestPermissionsResult(requestCode, permissions, results);
        if (requestCode == LIVE_RUNTIME_PERMISSION_REQUEST) {
            if (pendingLiveLaunch == null) return;
            if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED
                    || checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                toast("Le mode Live a besoin de la caméra et du microphone");
                pendingLiveLaunch = null;
                return;
            }
            continueLiveLaunch();
            return;
        }
        if (requestCode == RUNTIME_PERMISSION_REQUEST && pendingWebPermission != null) {
            PermissionRequest request = pendingWebPermission;
            pendingWebPermission = null;
            grantAllowedWebResources(request);
        }
    }
'''
          changed |= replace_once('app/src/main/java/com/chasmet/grokteleprompter/MainActivity.java', old_permissions, new_permissions, 'main live runtime permission')

          old_result = '''    @Override
    protected void onActivityResult(int requestCode, int resultCode, Intent data) {
        super.onActivityResult(requestCode, resultCode, data);
        if (requestCode == FILE_CHOOSER_REQUEST && pendingFileChooser != null) {
            Uri[] result = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
            pendingFileChooser.onReceiveValue(result);
            pendingFileChooser = null;
        }
    }
'''
          new_result = '''    @Override
    protected void onActivityResult(int requestCode, int resultCode, Intent data) {
        super.onActivityResult(requestCode, resultCode, data);
        if (requestCode == LIVE_OVERLAY_PERMISSION_REQUEST) {
            if (pendingLiveLaunch == null) return;
            if (!Settings.canDrawOverlays(this)) {
                toast("Autorise Grok Téléprompteur à s’afficher par-dessus les autres applications");
                pendingLiveLaunch = null;
                return;
            }
            requestLiveScreenCapture();
            return;
        }
        if (requestCode == LIVE_CAPTURE_REQUEST) {
            if (pendingLiveLaunch == null) return;
            if (resultCode != RESULT_OK || data == null) {
                toast("La capture d’écran est nécessaire pour enregistrer le Live");
                pendingLiveLaunch = null;
                return;
            }
            startLiveOverlayService(resultCode, data);
            return;
        }
        if (requestCode == FILE_CHOOSER_REQUEST && pendingFileChooser != null) {
            Uri[] result = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
            pendingFileChooser.onReceiveValue(result);
            pendingFileChooser = null;
        }
    }
'''
          changed |= replace_once('app/src/main/java/com/chasmet/grokteleprompter/MainActivity.java', old_result, new_result, 'main live activity results')

          marker = '    private void handleBackNavigation() {\n'
          live_methods = '''    private void beginLiveOverlay(String script, int speed, int fontSize) {
        pendingLiveLaunch = new LiveLaunchRequest(script, speed, fontSize);
        ArrayList<String> missing = new ArrayList<>();
        if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
            missing.add(Manifest.permission.CAMERA);
        }
        if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
            missing.add(Manifest.permission.RECORD_AUDIO);
        }
        if (!missing.isEmpty()) {
            requestPermissions(missing.toArray(new String[0]), LIVE_RUNTIME_PERMISSION_REQUEST);
            return;
        }
        continueLiveLaunch();
    }

    private void continueLiveLaunch() {
        if (pendingLiveLaunch == null) return;
        if (!Settings.canDrawOverlays(this)) {
            try {
                Intent overlay = new Intent(
                        Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                        Uri.parse("package:" + getPackageName())
                );
                startActivityForResult(overlay, LIVE_OVERLAY_PERMISSION_REQUEST);
            } catch (Exception error) {
                toast("Impossible d’ouvrir l’autorisation d’affichage flottant");
                pendingLiveLaunch = null;
            }
            return;
        }
        requestLiveScreenCapture();
    }

    private void requestLiveScreenCapture() {
        MediaProjectionManager manager = (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);
        if (manager == null) {
            toast("Capture d’écran Android indisponible");
            pendingLiveLaunch = null;
            return;
        }
        startActivityForResult(manager.createScreenCaptureIntent(), LIVE_CAPTURE_REQUEST);
    }

    private void startLiveOverlayService(int resultCode, Intent resultData) {
        LiveLaunchRequest request = pendingLiveLaunch;
        pendingLiveLaunch = null;
        if (request == null) return;
        Intent service = new Intent(this, LiveOverlayService.class);
        service.setAction(LiveOverlayService.ACTION_START);
        service.putExtra(LiveOverlayService.EXTRA_RESULT_CODE, resultCode);
        service.putExtra(LiveOverlayService.EXTRA_RESULT_DATA, resultData);
        service.putExtra(LiveOverlayService.EXTRA_SCRIPT, request.script);
        service.putExtra(LiveOverlayService.EXTRA_SPEED, request.speed);
        service.putExtra(LiveOverlayService.EXTRA_FONT_SIZE, request.fontSize);
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(service);
        else startService(service);
        toast("Live fond d’écran lancé · tu peux maintenant te balader sur le téléphone");
        moveTaskToBack(true);
    }

'''
          main_path = Path('app/src/main/java/com/chasmet/grokteleprompter/MainActivity.java')
          main_text = main_path.read_text(encoding='utf-8')
          if live_methods not in main_text:
              if marker not in main_text:
                  raise SystemExit('Patch introuvable: main live methods marker')
              main_path.write_text(main_text.replace(marker, live_methods + marker, 1), encoding='utf-8')
              changed = True
              print('patched: main live methods')

          bridge_marker = '''        @JavascriptInterface
        public void openAppSettings() {
'''
          bridge_method = '''        @JavascriptInterface
        public void startLiveOverlay(String script, int speed, int fontSize) {
            runOnUiThread(() -> beginLiveOverlay(script, speed, fontSize));
        }

'''
          main_text = main_path.read_text(encoding='utf-8')
          if bridge_method not in main_text:
              if bridge_marker not in main_text:
                  raise SystemExit('Patch introuvable: bridge live marker')
              main_path.write_text(main_text.replace(bridge_marker, bridge_method + bridge_marker, 1), encoding='utf-8')
              changed = True
              print('patched: bridge live method')

          launch_class = '''    private static final class LiveLaunchRequest {
        final String script;
        final int speed;
        final int fontSize;

        LiveLaunchRequest(String script, int speed, int fontSize) {
            String safe = script == null ? "" : script.trim();
            this.script = safe.isEmpty() ? "Bienvenue dans Grok Téléprompteur Live." : safe;
            this.speed = Math.max(1, Math.min(10, speed));
            this.fontSize = Math.max(20, Math.min(70, fontSize));
        }
    }

'''
          save_marker = '    private static final class SaveSession {\n'
          main_text = main_path.read_text(encoding='utf-8')
          if launch_class not in main_text:
              if save_marker not in main_text:
                  raise SystemExit('Patch introuvable: live launch class marker')
              main_path.write_text(main_text.replace(save_marker, launch_class + save_marker, 1), encoding='utf-8')
              changed = True
              print('patched: live launch request class')

          if not changed:
              print('No changes required')

      - name: Validate sources
        run: |
          node --check script.js
          node --check live-mode.js
          npm ci
          npm test

      - name: Commit upgrade
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app/src/main/AndroidManifest.xml app/build.gradle .github/workflows/build-apk.yml app/src/main/java/com/chasmet/grokteleprompter/MainActivity.java
          git commit -m "feat: add live green-screen teleprompter overlay v2.16"
          git push
