name: Retest teleprompter orientation v2.17.3

on:
  push:
    paths:
      - '.github/workflows/retry-tele-orientation-v2173.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v2.17.3 patch from validated patch workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/add-tele-orientation-v2173.yml').read_text()
          start_token = "          python3 - <<'PY'\n"
          end_token = "          PY\n\n          git diff --check"
          start = workflow.index(start_token) + len(start_token)
          end = workflow.index(end_token, start)
          script = workflow[start:end]
          lines = []
          for line in script.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          code = '\n'.join(lines) + '\n'
          exec(compile(code, 'tele_orientation_patch.py', 'exec'), {'__name__': '__main__'})

          test_path = Path('tests/app.e2e.js')
          tests = test_path.read_text()
          tests = tests.replace(
              "await page.locator('#teleFormatHorizontal').check();",
              "await page.locator('label:has(#teleFormatHorizontal) span').click();\n  await expect(page.locator('#teleFormatHorizontal')).toBeChecked();"
          )
          tests = tests.replace(
              "await page.locator('#teleFormatVertical').check();",
              "await page.locator('label:has(#teleFormatVertical) span').click();\n  await expect(page.locator('#teleFormatVertical')).toBeChecked();"
          )
          tests = tests.replace(
              "  const start = await prompt.boundingBox();",
              "  await prompt.scrollIntoViewIfNeeded();\n  const start = await prompt.boundingBox();",
              1
          )
          test_path.write_text(tests)
          PY
          git diff --check
          node --check script.js

      - name: Install interface tests
        run: npm ci

      - name: Run static audit
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test real portrait landscape controls and REC touch
        run: npm run test:e2e

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Lint and build APK
        run: gradle :app:lintDebug :app:assembleDebug --stacktrace

      - name: Commit tested v2.17.3
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html style.css script.js tests/app.e2e.js app/build.gradle
          git rm .github/workflows/add-tele-orientation-v2173.yml .github/workflows/retry-tele-orientation-v2173.yml
          git commit -m 'feat: teleprompter portrait and landscape v2.17.3'
          git push origin main
