name: Fix Recording Pause

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Link teleprompter pause to recorder pause
        shell: python
        run: |
          from pathlib import Path

          p = Path('script.js')
          text = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if new in text:
                  print(f'already patched: {label}')
                  return
              if old not in text:
                  raise SystemExit(f'Patch introuvable: {label}')
              text = text.replace(old, new, 1)
              print(f'patched: {label}')

          replace_once(
              "    recordingName: '', timerId: 0, startedAt: 0, renderId: 0, wakeLock: null,\n",
              "    recordingName: '', timerId: 0, startedAt: 0, recordingPausedAt: 0, recordingPausedMs: 0,\n    recordingMediaWasPlaying: false, renderId: 0, wakeLock: null,\n",
              'recording pause state'
          )

          replace_once(
              "  function updateTimer() {\n    const seconds = Math.floor((Date.now() - state.startedAt) / 1000);\n    elements.timer.textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;\n  }\n",
              "  function updateTimer() {\n    const livePauseMs = state.recordingPausedAt ? Date.now() - state.recordingPausedAt : 0;\n    const elapsedMs = Math.max(0, Date.now() - state.startedAt - state.recordingPausedMs - livePauseMs);\n    const seconds = Math.floor(elapsedMs / 1000);\n    elements.timer.textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;\n  }\n",
              'pause aware timer'
          )

          replace_once(
              "  function toggleTeleprompterPause() {\n    if (state.telePaused) resumeTeleprompter();\n    else pauseTeleprompter();\n  }\n",
              "  function pauseActiveRecording() {\n    const recorder = state.recorder;\n    if (!recorder || recorder.state !== 'recording') return false;\n    try {\n      recorder.pause();\n      state.recordingPausedAt = Date.now();\n      state.recordingMediaWasPlaying = state.mediaType === 'video' && !elements.mediaVideo.paused;\n      if (state.recordingMediaWasPlaying) elements.mediaVideo.pause();\n      elements.audioPeak.textContent = 'PAUSE';\n      elements.recordQuality.textContent = 'Enregistrement en pause';\n      updateTimer();\n      return true;\n    } catch (error) {\n      showStatus(`Pause enregistrement impossible : ${error.message || error.name}`, true, 4200);\n      return false;\n    }\n  }\n  function resumeActiveRecording() {\n    const recorder = state.recorder;\n    if (!recorder || recorder.state !== 'paused') return false;\n    try {\n      recorder.resume();\n      if (state.recordingPausedAt) state.recordingPausedMs += Date.now() - state.recordingPausedAt;\n      state.recordingPausedAt = 0;\n      if (state.recordingMediaWasPlaying && state.mediaType === 'video') {\n        elements.mediaVideo.play().catch(() => {});\n      }\n      state.recordingMediaWasPlaying = false;\n      elements.audioPeak.textContent = 'REC';\n      elements.recordQuality.textContent = `${recordSize().height}p · ${selectedProfile().label} · ${state.nativeMicrophone?.active ? 'micro caméra 48 kHz' : 'micro actif'}`;\n      updateTimer();\n      return true;\n    } catch (error) {\n      showStatus(`Reprise enregistrement impossible : ${error.message || error.name}`, true, 4200);\n      return false;\n    }\n  }\n  function toggleTeleprompterPause() {\n    const recordingActive = !!state.recorder && state.recorder.state !== 'inactive';\n    if (state.telePaused) {\n      if (recordingActive && state.recorder.state === 'paused') resumeActiveRecording();\n      resumeTeleprompter();\n      showStatus(recordingActive ? 'Enregistrement et téléprompteur repris' : 'Téléprompteur repris', false, 1800);\n      return;\n    }\n    if (recordingActive && state.recorder.state === 'recording') pauseActiveRecording();\n    pauseTeleprompter();\n    showStatus(recordingActive ? 'Enregistrement en pause · texte tactile actif' : 'Téléprompteur en pause · texte tactile actif', false, 2200);\n  }\n",
              'combined recorder teleprompter pause'
          )

          replace_once(
              "    state.startedAt = Date.now();\n    state.timerId = window.setInterval(updateTimer, 400);\n",
              "    state.startedAt = Date.now();\n    state.recordingPausedAt = 0;\n    state.recordingPausedMs = 0;\n    state.recordingMediaWasPlaying = false;\n    state.timerId = window.setInterval(updateTimer, 400);\n",
              'reset pause counters on recording start'
          )

          p.write_text(text, encoding='utf-8')

      - name: Validate JavaScript
        run: node --check script.js

      - name: Run automated tests
        run: |
          npm ci
          npm test

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "fix: pause recording with teleprompter button"
          git push
