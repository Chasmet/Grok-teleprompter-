name: Fix teleprompter REC touch v2.17.2

on:
  push:
    paths:
      - '.github/workflows/fix-tele-rec-touch-v2172.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply REC touch fix
        run: |
          python3 tools/fix_tele_rec_touch_v2172.py
          git diff --check
          node --check script.js
      - name: Install interface tests
        run: npm ci
      - name: Run static audit
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify real teleprompter drag while recording
        run: npm run test:e2e
      - name: Commit v2.17.2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css script.js app/build.gradle tests/app.e2e.js
          git commit -m 'fix: enable teleprompter touch during recording v2.17.2'
          git push origin main

# geometry-based REC drag test
