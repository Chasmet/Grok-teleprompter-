name: Apply Live child layers v2.16.6

on:
  push:
    paths:
      - tools/apply_live_child_layers_v2166.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v2.16.6 fix
        run: python3 tools/apply_live_child_layers_v2166.py

      - name: Validate capture architecture
        run: |
          grep -q 'versionName '\''2.16.6'\''' app/build.gradle
          grep -q 'markSurfaceSkipScreenshot' app/src/main/java/com/chasmet/grokteleprompter/LiveOverlayService.java
          grep -q 'controlsDisplayRoot' app/src/main/java/com/chasmet/grokteleprompter/LiveOverlayService.java
          grep -q 'dp(218)' app/src/main/java/com/chasmet/grokteleprompter/LiveOverlayService.java
          grep -q 'dp(76)' app/src/main/java/com/chasmet/grokteleprompter/LiveOverlayService.java
          if grep -q 'markWindowSkipScreenshot' app/src/main/java/com/chasmet/grokteleprompter/LiveOverlayService.java; then
            echo 'Whole-window SKIP_SCREENSHOT must not remain' >&2
            exit 1
          fi
          if grep -q 'setSecure(true)' app/src/main/java/com/chasmet/grokteleprompter/LiveOverlayService.java; then
            echo 'Secure SurfaceView must not remain' >&2
            exit 1
          fi

      - name: Compile Java immediately
        run: |
          gradle :app:compileDebugJavaWithJavac --stacktrace

      - name: Commit v2.16.6
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/chasmet/grokteleprompter/LiveOverlayService.java app/build.gradle
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: isolate Live UI from Huawei recording'
          git push origin main
