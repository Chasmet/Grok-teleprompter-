name: Apply Live SKIP_SCREENSHOT v2.16.5

on:
  push:
    paths:
      - tools/apply_live_skip_screenshot_v2165.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v2.16.5 fix
        run: python3 tools/apply_live_skip_screenshot_v2165.py
      - name: Validate source policy
        run: |
          grep -q 'markWindowSkipScreenshot' app/src/main/java/com/chasmet/grokteleprompter/LiveOverlayService.java
          grep -q 'setSkipScreenshot' app/src/main/java/com/chasmet/grokteleprompter/LiveOverlayService.java
          grep -q 'hiddenapibypass:6.1' app/build.gradle
          if grep -q 'teleSecureSurface.setSecure(true)' app/src/main/java/com/chasmet/grokteleprompter/LiveOverlayService.java; then
            echo 'Secure SurfaceView must not be used on Huawei' >&2
            exit 1
          fi
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/chasmet/grokteleprompter/LiveOverlayService.java app/build.gradle
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: exclude Live UI without black recording'
          git push origin main
