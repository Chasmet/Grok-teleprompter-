name: Construire l'APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Vérifier et construire
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Vérifier JavaScript
        run: |
          node --check script.js
          node --check live-mode.js

      - name: Installer les tests de l’interface
        run: npm ci

      - name: Exécuter l’audit automatisé
        run: npm test

      - name: Installer Chromium pour les tests tactiles
        run: npx playwright install --with-deps chromium

      - name: Tester toutes les fonctions dans un navigateur mobile
        run: npm run test:e2e

      - name: Installer Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Analyser et construire l'APK
        run: gradle :app:lintDebug :app:assembleDebug --stacktrace

      - name: Préparer le nom de version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          if [ -z "$VERSION" ]; then
            echo "Version Android introuvable" >&2
            exit 1
          fi
          APK="Grok-Teleprompter-v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Vérifier la signature stable
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "${{ steps.version.outputs.apk }}"

      - name: Publier l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: Grok-Teleprompter-APK
          path: ${{ steps.version.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Publier la mise à jour interne GitHub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.version.outputs.apk }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" \
              --title "Grok Téléprompteur v${VERSION}" \
              --notes "Mise à jour interne Grok Téléprompteur v${VERSION}. Téléchargement et installation disponibles directement depuis Réglages > Mise à jour interne."
          else
            gh release create "$TAG" "$APK" \
              --title "Grok Téléprompteur v${VERSION}" \
              --notes "Mise à jour interne Grok Téléprompteur v${VERSION}. Téléchargement et installation disponibles directement depuis Réglages > Mise à jour interne." \
              --latest
          fi

