name: Construire APK v2.16.4 Secure Smooth

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Vérifier et construire
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Vérifier JavaScript
        run: |
          node --check script.js
          node --check live-mode.js

      - name: Vérifier les surfaces privées Live
        run: |
          SERVICE=app/src/main/java/com/chasmet/grokteleprompter/LiveOverlayService.java
          SURFACE=app/src/main/java/com/chasmet/grokteleprompter/PrivateOverlaySurface.java
          test -f "$SURFACE"
          grep -q 'setSecure(true)' "$SURFACE"
          grep -q 'setZOrderOnTop(true)' "$SURFACE"
          grep -q 'telePrivateSurface = new PrivateOverlaySurface' "$SERVICE"
          grep -q 'controlsPrivateSurface = new PrivateOverlaySurface' "$SERVICE"
          grep -q 'teleText.setAlpha(0f)' "$SERVICE"
          grep -q 'content.setAlpha(0f)' "$SERVICE"
          ! grep -q 'FLAG_SECURE' "$SERVICE"

      - name: Installer les tests de l’interface
        run: npm ci

      - name: Exécuter l’audit automatisé
        run: npm test

      - name: Installer Chromium pour les tests tactiles
        run: npx playwright install --with-deps chromium

      - name: Tester toutes les fonctions dans un navigateur mobile
        run: npm run test:e2e

      - name: Installer Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Analyser et construire l'APK
        run: gradle :app:lintDebug :app:assembleDebug --stacktrace

      - name: Vérifier et signer l'artefact de test
        run: |
          APK=Grok-Teleprompter-v2.16.4-Secure-Smooth.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          test "$(stat -c%s "$APK")" -gt 1000000
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionName='2.16.4'"
          sha256sum "$APK" > "$APK.sha256"

      - name: Publier l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: Grok-Teleprompter-v2.16.4-Secure-Smooth
          path: |
            Grok-Teleprompter-v2.16.4-Secure-Smooth.apk
            Grok-Teleprompter-v2.16.4-Secure-Smooth.apk.sha256
          if-no-files-found: error
          retention-days: 30
