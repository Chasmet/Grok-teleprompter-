name: Fix live e2e gate

on:
  push:
    paths:
      - '.github/workflows/fix-live-e2e-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update mobile tests for mode gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/app.e2e.js')
          s = p.read_text(encoding='utf-8')
          old = "test.beforeEach(async ({ page }) => {\n  await page.goto('/index.html');\n  await page.waitForLoadState('networkidle');\n});\n"
          new = "test.beforeEach(async ({ page }) => {\n  await page.goto('/index.html');\n  await page.waitForLoadState('networkidle');\n  const modeGate = page.locator('#modeGate');\n  if (await modeGate.count()) {\n    await expect(page.locator('#gateClassic')).toBeVisible();\n    await expect(page.locator('#gateGreen')).toBeVisible();\n    await expect(page.locator('#gateLive')).toBeVisible();\n    await page.locator('#gateClassic').click();\n    await expect(modeGate).toBeHidden();\n  }\n});\n"
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          elif "page.locator('#gateClassic').click()" not in s:
              raise SystemExit('beforeEach introuvable')
          PY
      - name: Commit tests
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/app.e2e.js
          git commit -m "test: select classic mode after three-mode launcher"
          git pull --rebase origin main
          git push origin HEAD:main
