name: Patch teleprompter touch test v2.17.1

on:
  push:
    paths:
      - '.github/workflows/patch-test-tele-touch-v2171.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update teleprompter gesture test
        run: |
          python3 tools/patch_tele_touch_test_v2171.py
          git diff --check
      - name: Commit corrected test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/app.e2e.js
          git commit -m 'test: verify teleprompter text drag during recording'
          git push origin main
