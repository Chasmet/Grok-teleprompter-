<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Téléprompteur Pro</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="mode-tabs">
      <button id="modeLiveBtn" class="tab active">🔴 Live</button>
      <button id="modeVideoBtn" class="tab">🎬 Vidéo importée</button>
    </header>

    <section class="preview-area">
      <video id="cameraPreview" autoplay playsinline muted></video>
      <video id="importedVideo" playsinline muted hidden></video>
    </section>

    <section id="livePanel" class="panel-controls">
      <button id="cameraBtn">📷 Caméra</button>
      <button id="flipBtn">🔄 Retourner</button>
      <button id="mirrorLiveBtn">⇆ Miroir</button>
    </section>

    <section id="videoPanel" class="panel-controls" hidden>
      <label for="videoInput" class="file-btn">🎞️ Importer</label>
      <button id="playBtn">▶️ Lecture</button>
      <button id="pauseBtn">⏸️ Pause</button>
      <button id="mirrorVideoBtn">⇆ Miroir</button>
    </section>

    <input type="file" id="videoInput" accept="video/*" hidden>

    <section class="record-bar">
      <button id="recordBtn" class="record">🔴 Enregistrer <span id="recordTimer">00:00</span></button>
      <button id="stopBtn" class="stop">⏹ Stop</button>
    </section>

    <section class="settings">
      <div class="setting">
        <label for="speedRange">Vitesse</label>
        <input type="range" id="speedRange" min="1" max="10" value="3">
      </div>

      <div class="setting">
        <label for="sizeRange">Taille du texte</label>
        <input type="range" id="sizeRange" min="24" max="80" value="44">
      </div>
    </section>

    <textarea id="scriptInput" spellcheck="false" placeholder="Colle ton texte ici...">Bienvenue dans mon téléprompteur.
La vidéo apparaît en haut.
Le texte défile en bas.
Le texte ne doit jamais sortir dans la vidéo.</textarea>

    <section class="text-controls">
      <button id="upBtn">⬆️ Monter</button>
      <button id="downBtn">⬇️ Descendre</button>
      <button id="applyTextBtn">✅ Entrer</button>
    </section>

    <section id="teleprompterContainer">
      <div id="teleprompterText"></div>
    </section>

    <a id="downloadLink" hidden>Télécharger la vidéo</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
