<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <title>Grok Teleprompter Studio</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Studio personnel</p>
        <h1>Grok Teleprompter</h1>
      </div>
      <div id="modeBadge" class="badge">Mode Live</div>
    </header>

    <nav class="tabs" aria-label="Modes">
      <button class="tab-btn active" data-mode="live" type="button">📹 Live</button>
      <button class="tab-btn" data-mode="video" type="button">🎬 Vidéo + Voix</button>
    </nav>

    <section class="card stage-card">
      <div class="studio-toolbar">
        <button id="startBtn" class="start-btn" type="button">▶ Play</button>
        <button id="recordBtn" class="record-btn" type="button">⏺ REC</button>
        <button id="moveUpBtn" type="button">⬆ Monter</button>
        <button id="moveDownBtn" type="button">⬇ Descendre</button>
        <button id="stopRecordBtn" class="stop-btn" type="button">⏹ Stop</button>
        <button id="pauseBtn" class="pause-btn" type="button">⏸ Pause</button>
      </div>

      <div class="stage-header">
        <span id="stageTitle">Aperçu caméra</span>
      </div>

      <div class="stage" id="stageContainer">
        <video id="cameraPreview" autoplay muted playsinline></video>
        <video id="videoPreview" playsinline controls hidden></video>

        <span id="recordingIndicator" class="rec-pill" hidden>● REC 00:00</span>

        <div id="prompterOverlay" class="prompter-overlay">
          <div id="prompterText" class="prompter-text">Colle ton texte ici.</div>
        </div>
      </div>
    </section>

    <section id="livePanel" class="card panel">
      <div class="panel-title">Mode Live</div>
      <label class="field">
        <span>Qualité vidéo</span>
        <select id="qualitySelect">
          <option value="720">720p HD</option>
          <option value="1080" selected>1080p Full HD</option>
          <option value="2160">4K Ultra HD</option>
        </select>
      </label>
      <button id="cameraBtn" class="primary-btn" type="button">📷 Activer la caméra</button>
      <button id="flipCameraBtn" class="secondary-btn" type="button">🔄 Retourner caméra</button>
    </section>

    <section id="videoPanel" class="card panel" hidden>
      <div class="panel-title">Mode Vidéo + Voix</div>
      <label class="field">
        <span>Importer une vidéo</span>
        <input id="videoInput" type="file" accept="video/*">
      </label>
      <p class="hint">La vidéo importée sera enregistrée avec ta voix.</p>
    </section>

    <section class="card panel">
      <div class="panel-title">Réglages</div>

      <label class="field">
        <span>Vitesse du texte</span>
        <input id="speed" type="range" min="0.5" max="4" step="0.1" value="1.8">
      </label>

      <label class="field">
        <span>Taille du texte</span>
        <input id="size" type="range" min="32" max="96" step="2" value="58">
      </label>

      <label class="field">
        <span>Position du texte</span>
        <input id="positionSlider" type="range" min="-800" max="800" step="10" value="100">
      </label>

      <label class="field">
        <span>Format vidéo</span>
        <select id="formatSelect">
          <option value="9:16" selected>9:16 Vertical (TikTok)</option>
          <option value="16:9">16:9 Paysage (YouTube)</option>
          <option value="1:1">1:1 Carré</option>
        </select>
      </label>

      <button id="downloadBtn" class="download-btn" type="button">💾 Télécharger</button>
      <button id="resetBtn" class="reset-btn" type="button">🔄 Reset</button>
      <button id="mirrorBtn" class="mirror-btn" type="button">🪞 Miroir</button>
    </section>

    <section class="card panel">
      <div class="panel-title">Script</div>
      <textarea id="scriptInput" placeholder="Colle ici ton texte..."></textarea>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
