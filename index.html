<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Grok Facecam Studio</title>
<meta name="theme-color" content="#050b1f">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%;background:#050b1f;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}body{padding-bottom:20px}.top{position:sticky;top:0;z-index:50;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px;background:#09122a}.tab{min-height:48px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:#1e293b;color:#aab4c3;font-weight:900;font-size:14px}.tab.active{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff}.viewer{height:56dvh;min-height:360px;max-height:620px;background:#0a0a0a;display:flex;align-items:center;justify-content:center;border-bottom:3px solid #2563eb;padding:10px}.stage{position:relative;background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.08);overflow:hidden;touch-action:none}.stage video,.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#94a3b8;font-weight:900;padding:18px}.face{position:absolute;z-index:10;border:3px solid #fff;border-radius:14px;box-shadow:0 8px 26px rgba(0,0,0,.7);object-fit:cover!important;background:#111;touch-action:none}.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#09122a;border-bottom:1px solid rgba(255,255,255,.06)}.timer{font-family:monospace;color:#ff5b68;background:rgba(239,68,68,.16);border-radius:10px;padding:10px 16px;font-weight:900;font-size:22px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px 0}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:10px 12px 0}.btn,label.btn{min-height:58px;border:1px solid rgba(255,255,255,.13);border-radius:12px;background:#1e293b;color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none}.rec{background:#dc2626!important}.stop{background:#334155!important}.btn:disabled{opacity:.35}.small{font-size:15px;min-height:48px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:12px}.settings label{display:block;color:#aab4c3;font-weight:800;margin-bottom:6px}.settings input{width:100%}textarea{width:calc(100% - 24px);margin:8px 12px 0;background:#080c17;color:white;border:1px solid #1e293b;border-radius:12px;min-height:96px;padding:12px;font-size:16px;font-family:monospace}.download{display:none;margin:10px 12px;padding:14px;border-radius:12px;background:#10b981;color:#062014;font-weight:900;text-align:center;font-size:20px}.status{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:100;background:#0f172a;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:10px 16px;font-weight:900;display:none;white-space:nowrap}.hide{display:none!important}@media(max-width:430px){.viewer{height:54dvh;min-height:340px}.tab{font-size:12px}.btn,label.btn{font-size:16px;min-height:52px}.timer{font-size:18px}}
</style>
</head>
<body>
<div id="status" class="status"></div>
<header class="top">
<button id="liveTab" class="tab">Mode Live</button>
<button id="mediaTab" class="tab">Video importee</button>
<button id="faceTab" class="tab active">Video + Facecam</button>
</header>
<section class="viewer" id="viewer"><div class="stage" id="stage"><div class="empty" id="empty">Importe une video ou une image<br>comme dans CapCut</div><video id="mediaVideo" playsinline muted class="hide"></video><img id="mediaImage" class="hide" alt=""><video id="cameraVideo" autoplay playsinline muted class="face hide"></video></div></section>
<section class="bar"><div class="timer" id="timer">00:00</div><div style="display:flex;gap:10px"><button id="recBtn" class="btn rec" style="min-width:88px">Rec</button><button id="stopBtn" class="btn stop" style="min-width:88px" disabled>Stop</button></div></section>
<section class="row"><label class="btn" for="mediaInput">Importer</label><button id="cameraBtn" class="btn">Camera</button></section>
<section class="row"><button id="playBtn" class="btn">Play</button><button id="pauseBtn" class="btn">Pause</button></section>
<section class="row"><button id="minusBtn" class="btn">Facecam -</button><button id="plusBtn" class="btn">Facecam +</button></section>
<section class="row3"><button id="tlBtn" class="btn small">Haut gauche</button><button id="trBtn" class="btn small">Haut droit</button><button id="brBtn" class="btn small">Bas droit</button></section>
<section class="settings"><div><label>Vitesse</label><input id="speedRange" type="range" min="1" max="10" value="3"></div><div><label>Taille du texte</label><input id="sizeRange" type="range" min="20" max="70" value="36"></div></section>
<textarea id="scriptInput">Bienvenue dans Grok Teleprompteur Studio.
La video ou image est affichee comme CapCut : tout est visible.
Tu peux parler avec ta facecam par-dessus.</textarea>
<a id="download" class="download">Telecharger l'enregistrement</a>
<input id="mediaInput" type="file" accept="video/*,image/*" hidden>
<script>
(() => {
'use strict';
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
if (window.caches) caches.keys().then(keys=>keys.forEach(k=>caches.delete(k))).catch(()=>{});
const $=id=>document.getElementById(id);
const stage=$('stage'),viewer=$('viewer'),empty=$('empty'),mediaVideo=$('mediaVideo'),mediaImage=$('mediaImage'),cameraVideo=$('cameraVideo'),input=$('mediaInput'),download=$('download'),statusEl=$('status'),timer=$('timer');
const liveTab=$('liveTab'),mediaTab=$('mediaTab'),faceTab=$('faceTab');
let mode='facecam',mediaType='',mediaW=720,mediaH=1280,mediaUrl='',cameraStream=null,mediaRecorder=null,chunks=[],timerId=null,startTime=0,renderId=null,micStream=null;
let face={x:.05,y:.05,w:.28,h:.16};
let drag=false,dx=0,dy=0;
function status(t,err=false){statusEl.textContent=t;statusEl.style.color=err?'#ef4444':'#10b981';statusEl.style.display='block';clearTimeout(statusEl._t);statusEl._t=setTimeout(()=>statusEl.style.display='none',2500)}
function tabs(){liveTab.classList.toggle('active',mode==='live');mediaTab.classList.toggle('active',mode==='media');faceTab.classList.toggle('active',mode==='facecam');cameraVideo.classList.toggle('hide',!(mode==='facecam'&&cameraStream));layoutFace()}
function setMode(m){mode=m;tabs(); if(m==='live'){empty.classList.add('hide');mediaVideo.classList.add('hide');mediaImage.classList.add('hide');cameraVideo.classList.remove('face');cameraVideo.classList.remove('hide');setAspect(9,16)} else {cameraVideo.classList.add('face'); if(!mediaType) empty.classList.remove('hide');}}
liveTab.onclick=()=>setMode('live');mediaTab.onclick=()=>setMode('media');faceTab.onclick=()=>setMode('facecam');
function setAspect(w,h){mediaW=w||720;mediaH=h||1280;resizeStage()}
function resizeStage(){const ratio=mediaW/mediaH;const vw=viewer.clientWidth-20,vh=viewer.clientHeight-20;let w=vw,h=w/ratio;if(h>vh){h=vh;w=h*ratio}stage.style.width=Math.max(120,w)+'px';stage.style.height=Math.max(120,h)+'px';layoutFace()}
window.addEventListener('resize',resizeStage);
function layoutFace(){cameraVideo.style.left=(face.x*100)+'%';cameraVideo.style.top=(face.y*100)+'%';cameraVideo.style.width=(face.w*100)+'%';cameraVideo.style.height=(face.h*100)+'%'}
function moveFace(pos){const m=.03;if(pos==='tl'){face.x=m;face.y=m}if(pos==='tr'){face.x=1-face.w-m;face.y=m}if(pos==='br'){face.x=1-face.w-m;face.y=1-face.h-m}layoutFace()}
$('tlBtn').onclick=()=>moveFace('tl');$('trBtn').onclick=()=>moveFace('tr');$('brBtn').onclick=()=>moveFace('br');
$('minusBtn').onclick=()=>{face.w=Math.max(.14,face.w-.05);face.h=Math.max(.10,face.h-.035);face.x=Math.min(face.x,1-face.w-.02);face.y=Math.min(face.y,1-face.h-.02);layoutFace()};
$('plusBtn').onclick=()=>{face.w=Math.min(.55,face.w+.05);face.h=Math.min(.42,face.h+.035);face.x=Math.min(face.x,1-face.w-.02);face.y=Math.min(face.y,1-face.h-.02);layoutFace()};
cameraVideo.addEventListener('pointerdown',e=>{if(mode!=='facecam')return;const r=stage.getBoundingClientRect();drag=true;dx=(e.clientX-r.left)/r.width-face.x;dy=(e.clientY-r.top)/r.height-face.y;cameraVideo.setPointerCapture(e.pointerId);e.preventDefault()});
cameraVideo.addEventListener('pointermove',e=>{if(!drag)return;const r=stage.getBoundingClientRect();face.x=Math.max(0,Math.min(1-face.w,(e.clientX-r.left)/r.width-dx));face.y=Math.max(0,Math.min(1-face.h,(e.clientY-r.top)/r.height-dy));layoutFace();e.preventDefault()});
cameraVideo.addEventListener('pointerup',()=>drag=false);cameraVideo.addEventListener('pointercancel',()=>drag=false);
input.onchange=e=>{const file=e.target.files&&e.target.files[0];if(!file)return;if(mediaUrl)URL.revokeObjectURL(mediaUrl);mediaUrl=URL.createObjectURL(file);download.style.display='none';if(file.type.startsWith('image/')){mediaType='image';mediaImage.onload=()=>{setAspect(mediaImage.naturalWidth,mediaImage.naturalHeight);status('Image prete')};mediaImage.src=mediaUrl;mediaImage.classList.remove('hide');mediaVideo.classList.add('hide');empty.classList.add('hide')}else{mediaType='video';mediaVideo.onloadedmetadata=()=>{setAspect(mediaVideo.videoWidth,mediaVideo.videoHeight);status('Video prete')};mediaVideo.src=mediaUrl;mediaVideo.load();mediaVideo.muted=true;mediaVideo.classList.remove('hide');mediaImage.classList.add('hide');empty.classList.add('hide')}};
async function startCamera(){try{if(cameraStream)cameraStream.getTracks().forEach(t=>t.stop());cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:true});cameraVideo.srcObject=cameraStream;cameraVideo.classList.remove('hide');if(mode==='live'){setAspect(9,16);cameraVideo.classList.remove('face')}else cameraVideo.classList.add('face');tabs();status('Camera prete')}catch(e){status('Camera refusee',true)}}
$('cameraBtn').onclick=startCamera;$('playBtn').onclick=()=>{if(mediaType==='video')mediaVideo.play()};$('pauseBtn').onclick=()=>{if(mediaType==='video')mediaVideo.pause()};
function pickMime(){return ['video/mp4;codecs=h264,aac','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||''}
function drawCover(ctx,src,x,y,w,h){const sw0=src.videoWidth||src.naturalWidth||w,sh0=src.videoHeight||src.naturalHeight||h;const sc=Math.max(w/sw0,h/sh0),sw=w/sc,sh=h/sc;ctx.drawImage(src,(sw0-sw)/2,(sh0-sh)/2,sw,sh,x,y,w,h)}
function drawFrame(ctx,canvas){ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);if(mediaType==='image')ctx.drawImage(mediaImage,0,0,canvas.width,canvas.height);if(mediaType==='video'&&mediaVideo.readyState>=2)ctx.drawImage(mediaVideo,0,0,canvas.width,canvas.height);if(mode==='facecam'&&cameraVideo.readyState>=2){const x=face.x*canvas.width,y=face.y*canvas.height,w=face.w*canvas.width,h=face.h*canvas.height;drawCover(ctx,cameraVideo,x,y,w,h);ctx.lineWidth=Math.max(4,canvas.width*.006);ctx.strokeStyle='#fff';ctx.strokeRect(x,y,w,h)}}
async function addMic(stream){if(cameraStream&&cameraStream.getAudioTracks().length){cameraStream.getAudioTracks().forEach(t=>stream.addTrack(t));return}try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});micStream.getAudioTracks().forEach(t=>stream.addTrack(t))}catch(e){status('Micro refuse',true)}}
function tick(){const s=Math.floor((Date.now()-startTime)/1000);timer.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
async function startRec(){chunks=[];download.style.display='none';let stream;if(mode==='live'){if(!cameraStream){status('Active la camera',true);return}stream=cameraStream}else{if(!mediaType){status('Importe une image ou une video',true);return}if(mode==='facecam'&&!cameraStream){status('Active la camera',true);return}const canvas=document.createElement('canvas');canvas.width=mediaW;canvas.height=mediaH;const ctx=canvas.getContext('2d');if(mediaType==='video')await mediaVideo.play().catch(()=>{});const loop=()=>{drawFrame(ctx,canvas);renderId=requestAnimationFrame(loop)};loop();stream=canvas.captureStream(30);await addMic(stream)}const mime=pickMime();try{mediaRecorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream)}catch(e){mediaRecorder=new MediaRecorder(stream)}mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};mediaRecorder.onstop=()=>{if(renderId)cancelAnimationFrame(renderId);renderId=null;clearInterval(timerId);timer.textContent='00:00';$('recBtn').disabled=false;$('stopBtn').disabled=true;if(mediaType==='video')mediaVideo.pause();if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}const type=mediaRecorder.mimeType||'video/webm',ext=type.includes('mp4')?'mp4':'webm';const blob=new Blob(chunks,{type});download.href=URL.createObjectURL(blob);download.download='Grok_Facecam_'+Date.now()+'.'+ext;download.style.display='block';status('Video sauvegardee')};mediaRecorder.start(1000);startTime=Date.now();timerId=setInterval(tick,500);$('recBtn').disabled=true;$('stopBtn').disabled=false;status('Enregistrement lance')}
function stopRec(){if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop()}
$('recBtn').onclick=startRec;$('stopBtn').onclick=stopRec;
setAspect(9,16);tabs();resizeStage();
})();
</script>
</body>
</html>
