<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Téléprompteur Double Écran</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <section class="top-screen">
      <video id="videoPreview" autoplay playsinline muted></video>
      <video id="importedVideo" playsinline muted hidden></video>
      <canvas id="recordCanvas" hidden></canvas>
    </section>

    <section class="bottom-screen">
      <div class="controls">
        <button id="cameraBtn">📷 Caméra</button>
        <button id="uploadBtn">🎞️ Vidéo</button>
        <button id="playBtn">▶️ Lecture</button>
        <button id="pauseBtn">⏸️ Pause</button>
        <button id="recordBtn">🔴 Enregistrer</button>
      </div>

      <input type="file" id="videoInput" accept="video/*" hidden />

      <div class="settings">
        <label>Vitesse</label>
        <input type="range" id="speedRange" min="1" max="10" value="3" />
      </div>

      <textarea id="scriptInput" placeholder="Colle ton texte ici...">Bienvenue dans mon téléprompteur double écran.</textarea>

      <div id="teleprompterContainer">
        <div id="teleprompterText"></div>
      </div>

      <a id="downloadLink" hidden>Télécharger la vidéo</a>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
