<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Grok Téléprompteur Studio</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#050b1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Grok Prompter">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    
    <header class="mode-tabs">
      <button id="modeLiveBtn" class="tab active">🔴 Mode Live</button>
      <button id="modeVideoBtn" class="tab">🎬 Vidéo importée</button>
    </header>

    <main class="studio-area">
      <section class="preview-container">
        <video id="cameraPreview" autoplay playsinline muted></video>
        <video id="importedVideo" playsinline muted style="display: none;"></video>
      </section>

      <section id="teleprompterContainer">
        <div id="teleprompterText"></div>
      </section>
    </main>

    <section class="action-bar">
      <div class="timer-display">⏱️ <span id="recordTimer">00:00</span></div>
      <div class="record-controls">
        <button id="recordBtn" class="btn btn-record">🔴 Rec</button>
        <button id="stopBtn" class="btn btn-stop" disabled>⏹️ Stop</button>
      </div>
    </section>

    <section class="controls-wrapper">
      <div id="livePanel" class="panel-controls">
        <button id="cameraBtn" class="btn-sub">📷 Caméra On/Off</button>
        <button id="flipBtn" class="btn-sub">🔄 Objectif</button>
        <button id="mirrorLiveBtn" class="btn-sub">⇆ Miroir</button>
      </div>

      <div id="videoPanel" class="panel-controls" style="display: none;">
        <label for="videoInput" class="file-btn btn-sub">🎞️ Importer</label>
        <input type="file" id="videoInput" accept="video/*" style="display: none;">
        <button id="playBtn" class="btn-sub">▶️ Play</button>
        <button id="pauseBtn" class="btn-sub">⏸️ Pause</button>
        <button id="mirrorVideoBtn" class="btn-sub">⇆ Miroir</button>
        <button id="stopVideoBtn" class="btn-sub">⏹️ Reset</button>
      </div>
    </section>

    <section class="settings-panel">
      <div class="setting-row">
        <label for="speedRange">Vitesse</label>
        <input type="range" id="speedRange" min="1" max="10" value="3">
      </div>

      <div class="setting-row">
        <label for="sizeRange">Taille du texte</label>
        <input type="range" id="sizeRange" min="24" max="80" value="44">
      </div>
    </section>

    <section class="script-editor">
      <textarea id="scriptInput" spellcheck="false" placeholder="Colle ton texte ici...">Bienvenue dans Grok Téléprompteur Studio.
La vidéo apparaît en haut.
Le texte défile de manière fluide.
Enregistre en Live (vidéo) ou sur fichier importé (voix off) !</textarea>
      
      <div class="text-micro-adjustments">
        <button id="upBtn" class="btn-mini">⬆️ Monter</button>
        <button id="downBtn" class="btn-mini">⬇️ Descendre</button>
        <button id="applyTextBtn" class="btn-main-action">✅ Entrer</button>
      </div>
    </section>

    <p id="statusMessage" role="status" aria-live="polite" style="display: none;"></p>
    
    <div class="download-container">
      <a id="downloadLink" class="btn-download" style="display: none;" hidden>💾 Télécharger l'enregistrement</a>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
