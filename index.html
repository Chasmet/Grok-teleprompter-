<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grok Teleprompter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <video id="preview" autoplay playsinline muted></video>
        <video id="uploaded" autoplay playsinline loop muted style="display:none;"></video>

        <div id="prompter" class="prompter">
            <div id="prompter-text"></div>
        </div>

        <div class="tabs">
            <button onclick="switchMode('live')" class="tab live active" id="live-tab">📹 Live</button>
            <button onclick="switchMode('import')" class="tab import" id="import-tab">📥 Importer vidéo</button>
        </div>

        <div class="controls">
            <button onclick="startPrompter()" class="btn play">▶ Play</button>
            <button onclick="togglePause()" class="btn pause">⏸ Pause</button>
            <button onclick="resetPrompter()" class="btn stop">⏹ Stop</button>
            <button onclick="toggleRecording()" class="btn rec">● Rec</button>
            <button onclick="downloadVideo()" class="btn save">💾 Sauvegarder</button>
            <label class="btn import">📥 Importer <input type="file" id="file" accept="video/*" onchange="loadVideo(this)"></label>
        </div>

        <div class="sliders">
            <label>Vitesse <input type="range" id="speed" min="0.5" max="4" step="0.1" value="1.8"></label>
            <label>Taille <input type="range" id="size" min="40" max="100" step="2" value="58"></label>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
