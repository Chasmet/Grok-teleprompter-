plugins {
    id 'com.android.application'
}

final File signingPropertiesFile = rootProject.file('signing/signing.properties')
final File signingBase64File = rootProject.file('signing/grok-update.p12.b64')
final java.util.Properties signingProperties = new java.util.Properties()
signingPropertiesFile.withInputStream { signingProperties.load(it) }

final File generatedSigningDir = layout.buildDirectory.dir('generated/stableSigning').get().asFile
final File generatedSigningStore = new File(generatedSigningDir, 'grok-update.p12')
if (!generatedSigningStore.exists()) {
    generatedSigningDir.mkdirs()
    generatedSigningStore.bytes = java.util.Base64.decoder.decode(signingBase64File.text.trim())
}

android {
    namespace 'com.chasmet.grokteleprompter'
    compileSdk 36

    defaultConfig {
        applicationId 'com.chasmet.grokteleprompter'
        minSdk 29
        targetSdk 36
        versionCode 28
        versionName '2.17.3'
    }

    signingConfigs {
        stableUpdate {
            storeFile generatedSigningStore
            storePassword signingProperties.getProperty('storePassword')
            keyAlias signingProperties.getProperty('keyAlias')
            keyPassword signingProperties.getProperty('keyPassword')
            storeType signingProperties.getProperty('storeType', 'PKCS12')
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableUpdate
        }
        release {
            signingConfig signingConfigs.stableUpdate
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def generatedWebAssets = layout.buildDirectory.dir('generated/webAssets')

tasks.register('syncWebAssets', Sync) {
    from(rootProject.projectDir) {
        include 'index.html', 'style.css', 'script.js', 'live-mode.css', 'live-mode.js', 'native-audio-worklet.js', 'manifest.json', 'sw.js', 'icon-512.png'
    }
    into(generatedWebAssets)
}

android.sourceSets.main.assets.srcDir(generatedWebAssets)
tasks.named('preBuild').configure { dependsOn tasks.named('syncWebAssets') }

dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
    testImplementation 'junit:junit:4.13.2'
}
